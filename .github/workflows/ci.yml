name: CI

# Pushes and PRs: model tests, demo-project validation, stock-Godot headless smoke, native builds on all three desktop
# targets, and the addon ZIP. v* tags additionally publish the ZIP as a GitHub release. Manual partial=true (also used
# by scripts/ci-local.sh under act) packages with whatever native binaries the Linux job produced and names the ZIP
# *-partial.zip; it is never a release artifact.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      partial:
        description: Linux-only diagnostic ZIP (never a release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test tests/Dirge.Model.Tests -nologo

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build tools/dirge-validate -nologo -v q
      - name: Validate authored projects
        run: |
          shopt -s nullglob
          files=(demo/*.dirge.json demo/sandbox/*.dirge.json)
          [ ${#files[@]} -gt 0 ] || { echo "no *.dirge.json files found"; exit 1; }
          status=0
          for f in "${files[@]}"; do
            echo "::group::$f"
            dotnet run --no-build --project tools/dirge-validate -- "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Cache Godot ${{ env.GODOT_VERSION }} .NET
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-zip
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/godot-zip"
          curl -sSL --fail -o "$RUNNER_TEMP/godot-zip/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
      - name: Install Godot
        run: |
          unzip -oq "$RUNNER_TEMP/godot-zip/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install NecronomiDOM
        run: scripts/fetch-deps.sh
      - name: Headless smoke
        run: scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs
          path: |
            /tmp/dirge-import.log
            /tmp/dirge-smoke.log
          if-no-files-found: ignore

  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scons
      - name: Cache godot-cpp objects
        uses: actions/cache@v4
        with:
          path: |
            native/.sconsign.dblite
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/godot-cpp/src/**/*.o
          key: godot-cpp-linux-${{ hashFiles('.gitmodules', 'native/SConstruct', 'native/build.sh') }}
      - name: Build
        run: native/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: addons/dirge/bin/
          if-no-files-found: error

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scons
      - name: Cache godot-cpp objects
        uses: actions/cache@v4
        with:
          path: |
            native/.sconsign.dblite
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/godot-cpp/src/**/*.obj
          key: godot-cpp-windows-${{ hashFiles('.gitmodules', 'native/SConstruct') }}
      - name: Build
        shell: bash
        working-directory: native
        run: scons platform=windows target=template_release arch=x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: addons/dirge/bin/
          if-no-files-found: error

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install scons
      - name: Cache godot-cpp objects
        uses: actions/cache@v4
        with:
          path: |
            native/.sconsign.dblite
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/godot-cpp/src/**/*.o
          key: godot-cpp-macos-${{ hashFiles('.gitmodules', 'native/SConstruct') }}
      - name: Build
        working-directory: native
        run: scons platform=macos target=template_release arch=universal
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: addons/dirge/bin/
          if-no-files-found: error

  package:
    needs: [test, validate, smoke, native-linux, native-windows, native-macos]
    # Windows/macOS native jobs may be skipped or failed only for the explicit manual partial diagnostic.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.validate.result == 'success' && needs.smoke.result == 'success' && needs.native-linux.result == 'success' && ((needs.native-windows.result == 'success' && needs.native-macos.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.partial == true)) }}
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: addons/dirge/bin/
          merge-multiple: true
      - name: Assemble addon ZIP
        id: zip
        env:
          PARTIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.partial == true }}
        run: |
          echo "native binaries:"; find addons/dirge/bin -type f | sort
          if [ "$PARTIAL" = "true" ]; then
            scripts/package.sh --suffix -partial
          else
            scripts/package.sh
          fi
          zip="$(ls dist/Dirge-v*.zip)"
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"
          echo "path=$zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

  release:
    needs: package
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.name }}
          path: dist
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ needs.package.outputs.name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
