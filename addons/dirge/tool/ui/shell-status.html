<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Dirge status</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="shell.css">
</head>
<body>
<div class="statusbar" role="status">
    <p id="status-dirty" class="dirty" hidden>* unsaved</p>
    <p id="status-path" class="path">Untitled</p>
    <div class="field"><p id="status-errors" class="errors">0 errors</p><p id="status-warnings" class="warnings">0 warnings</p></div>
    <div class="field"><p class="label">inst</p><p id="status-instances" class="value">0</p></div>
    <div class="field"><p class="label">voices</p><p id="status-voices" class="value">0</p></div>
    <div class="field"><p class="label">update</p><p id="status-ms" class="value">0.00 ms</p></div>
    <div class="field"><p class="label">buses</p><p id="status-buses" class="value">1</p></div>
    <p id="status-live" class="live" hidden>live: —</p>
    <div class="spacer"></div>
    <p id="status-message" class="message"></p>
</div>
</body>
</html>
