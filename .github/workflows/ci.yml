name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      partial:
        description: Linux-only diagnostic ZIP (never a release)
        type: boolean
        default: false
      approved_pr:
        description: Reviewed fork PR number (manual approval only; leave empty for main)
        type: string
        default: ''
      approved_head:
        description: Exact reviewed fork PR head SHA (required with approved_pr)
        type: string
        default: ''

# The reusable definition reduces build permissions and isolates release writes.
permissions:
  contents: write
  pull-requests: read

jobs:
  local:
    # Runner groups allow ONLY this main-defined reusable workflow, not this caller.
    uses: Eldritch-Game-Studio/Dirge/.github/workflows/ci-local.yml@main
    with:
      partial: ${{ inputs.partial == true }}
      approved_pr: ${{ inputs.approved_pr || '' }}
      approved_head: ${{ inputs.approved_head || '' }}
