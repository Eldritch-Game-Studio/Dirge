name: Local qualification

# Runner groups must allow only this file at refs/heads/managed/1.0.x, never caller workflows.
on:
  workflow_call:
    inputs:
      partial:
        type: boolean
        default: false
      approved_pr:
        type: string
        default: ''
      approved_head:
        type: string
        default: ''
      requalification_run:
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # Reviewed manual dispatches and PR events must share one producer admission group.
  group: local-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.approved_pr != '' && format('pr-{0}', inputs.approved_pr) || github.ref }}
  # Preserve active native work; a changed PR head is rejected by trust before checkout.
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

defaults:
  run:
    shell: bash

jobs:
  trust:
    # Trusted inline definition only: never checkout or execute PR source here.
    runs-on: [self-hosted, Linux, X64, eldritch-linux]
    outputs:
      repository: ${{ steps.source.outputs.repository }}
      revision: ${{ steps.source.outputs.revision }}
      runner: ${{ steps.source.outputs.runner }}
      partial: ${{ steps.source.outputs.partial }}
      requalification_run: ${{ steps.source.outputs.requalification_run }}
    steps:
      - id: source
        uses: actions/github-script@v7
        env:
          APPROVED_PR: ${{ inputs.approved_pr }}
          APPROVED_HEAD: ${{ inputs.approved_head }}
          PARTIAL: ${{ inputs.partial }}
          REQUALIFICATION_RUN: ${{ inputs.requalification_run }}
        with:
          script: |
            const expected = 'Eldritch-Game-Studio/Dirge';
            if (`${context.repo.owner}/${context.repo.repo}` !== expected)
              throw new Error('This producer accepts only the Dirge repository.');
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: context.actor
            });
            if (!['admin', 'maintain', 'write'].includes(permission.data.permission))
              throw new Error('A repository collaborator must authorize local producer execution.');
            let repository = expected;
            let revision = context.sha;
            let partial = false;
            const recovery = process.env.REQUALIFICATION_RUN;
            if (recovery && (context.eventName !== 'workflow_dispatch' ||
                context.ref !== 'refs/heads/managed/1.0.x' || process.env.PARTIAL === 'true' ||
                process.env.APPROVED_PR || process.env.APPROVED_HEAD || !/^[1-9][0-9]*$/.test(recovery)))
              throw new Error('Requalification requires a managed-line manual dispatch, a run ID, no partial or PR approval.');
            if (context.eventName === 'pull_request') {
              const number = context.payload.pull_request.number;
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
              if (pr.head.repo?.full_name !== expected || pr.head.repo.fork || context.actor === 'dependabot[bot]')
                throw new Error('Untrusted PR: review it, then dispatch CI on managed/1.0.x with approved_pr and its exact approved_head SHA. No PR source was executed.');
              if (pr.head.sha !== context.payload.pull_request.head.sha)
                throw new Error('PR head changed; run qualification for the current head.');
              revision = pr.head.sha;
            } else if (context.eventName === 'workflow_dispatch') {
              if (context.ref !== 'refs/heads/managed/1.0.x')
                throw new Error('Manual approval must use the managed/1.0.x workflow definition.');
              partial = process.env.PARTIAL === 'true';
              if (process.env.APPROVED_PR) {
                if (!/^[1-9][0-9]*$/.test(process.env.APPROVED_PR) || !/^[0-9a-f]{40}$/.test(process.env.APPROVED_HEAD))
                  throw new Error('Approval requires a PR number and exact reviewed 40-character head SHA.');
                const {data: pr} = await github.rest.pulls.get({
                  ...context.repo, pull_number: Number(process.env.APPROVED_PR)
                });
                if (pr.state !== 'open' || pr.head.sha !== process.env.APPROVED_HEAD || !pr.head.repo)
                  throw new Error('Reviewed PR head is unavailable, closed, or changed; approval is not transferable.');
                repository = pr.head.repo.full_name;
                revision = pr.head.sha;
                core.notice(`Explicit approval by ${context.actor}: ${repository}@${revision} (PR #${pr.number})`);
              } else if (process.env.APPROVED_HEAD) {
                throw new Error('approved_head requires approved_pr.');
              }
            } else if (context.eventName !== 'push' || !(context.ref === 'refs/heads/managed/1.0.x' || context.ref.startsWith('refs/tags/v'))) {
              throw new Error('Unsupported producer event/ref.');
            }
            core.setOutput('repository', repository);
            core.setOutput('revision', revision);
            core.setOutput('partial', String(partial));
            core.setOutput('requalification_run', recovery);
            core.setOutput('runner', JSON.stringify(partial
              ? ['self-hosted', 'Linux', 'X64', 'eldritch-linux']
              : ['self-hosted', 'macOS', 'ARM64', 'eldritch-apple']));

  test:
    needs: trust
    if: needs.trust.outputs.requalification_run == ''
    runs-on: ${{ fromJSON(needs.trust.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.trust.outputs.repository }}
          ref: ${{ needs.trust.outputs.revision }}
          persist-credentials: false
      - run: python3 scripts/apple-run.py dotnet test tests/Dirge.Model.Tests -nologo
      - run: python3 scripts/apple-run.py python3 -m unittest discover -s tests/scripts -v

  validate:
    needs: trust
    if: needs.trust.outputs.requalification_run == ''
    runs-on: ${{ fromJSON(needs.trust.outputs.runner) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.trust.outputs.repository }}
          ref: ${{ needs.trust.outputs.revision }}
          persist-credentials: false
      - run: python3 scripts/apple-run.py bash scripts/validate.sh

  smoke:
    # Linux stock-Godot acceptance remains a separate OS-specific oracle.
    needs: [trust, native-linux]
    runs-on: [self-hosted, Linux, X64, eldritch-linux]
    steps:
      - name: Select isolated smoke log directory
        run: echo "DIRGE_SMOKE_LOG_DIR=$RUNNER_TEMP/dirge-smoke-linux" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.trust.outputs.repository }}
          ref: ${{ needs.trust.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-linux
          path: addons/dirge/bin/
      - name: Cache stock Godot .NET
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-zip
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64
      - run: scripts/install-godot.sh
      - run: scripts/fetch-deps.sh
      - run: scripts/smoke.sh
      - name: Tool UI documents and overlay in DocumentHost (PaintRun-JSON goldens)
        run: scripts/ui-proof.sh
      - name: Native runtime smoke
        run: |
          "$GODOT" --headless --audio-driver Dummy --path . res://native/tests/sendreturn.tscn 2>&1 | tee "$DIRGE_SMOKE_LOG_DIR/native.log"
          grep -q '^NATIVE_TEST PASS' "$DIRGE_SMOKE_LOG_DIR/native.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-linux
          path: ${{ env.DIRGE_SMOKE_LOG_DIR }}
          if-no-files-found: ignore

  native-linux:
    needs: trust
    if: needs.trust.outputs.requalification_run == ''
    runs-on: [self-hosted, Linux, X64, eldritch-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.trust.outputs.repository }}
          ref: ${{ needs.trust.outputs.revision }}
          submodules: recursive
          persist-credentials: false
      - id: native-pin
        run: echo "revision=$(git rev-parse HEAD:native/godot-cpp)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            native/.sconsign.dblite
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/godot-cpp/src/**/*.o
          key: godot-cpp-local-linux-${{ steps.native-pin.outputs.revision }}-${{ hashFiles('native/SConstruct', 'native/build.sh') }}
      - run: native/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: addons/dirge/bin/
          if-no-files-found: error

  native-windows:
    name: Windows x64 cross-build + Proton compatibility
    needs: trust
    if: needs.trust.outputs.partial != 'true' && needs.trust.outputs.requalification_run == ''
    runs-on: [self-hosted, Linux, X64, eldritch-linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.trust.outputs.repository }}
          ref: ${{ needs.trust.outputs.revision }}
          submodules: recursive
          persist-credentials: false
      - id: native-pin
        run: echo "revision=$(git rev-parse HEAD:native/godot-cpp)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            native/.sconsign.dblite
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/godot-cpp/src/**/*.o
          key: godot-cpp-local-mingw-${{ steps.native-pin.outputs.revision }}-${{ hashFiles('native/SConstruct', 'scripts/windows-native.sh') }}
      - name: Cross-build Windows x64 debug/release and inspect the PE ABI
        run: scripts/windows-native.sh
      - name: Stock Windows Godot.NET under official Proton (not native Windows)
        env:
          DIRGE_PROTON_LOG_DIR: ${{ runner.temp }}/dirge-smoke-windows-proton
        run: timeout --signal=TERM --kill-after=30s 40m python3 scripts/windows-proton.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-windows-proton
          path: ${{ runner.temp }}/dirge-smoke-windows-proton
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: addons/dirge/bin/
          if-no-files-found: error

  native-macos:
    needs: trust
    if: needs.trust.outputs.partial != 'true' && needs.trust.outputs.requalification_run == ''
    runs-on: [self-hosted, macOS, ARM64, eldritch-apple]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.trust.outputs.repository }}
          ref: ${{ needs.trust.outputs.revision }}
          submodules: recursive
          persist-credentials: false
      - id: native-pin
        run: echo "revision=$(git rev-parse HEAD:native/godot-cpp)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            native/.sconsign.dblite
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/godot-cpp/src/**/*.o
          key: godot-cpp-local-macos-universal-clt27.2-scons4.10.1-${{ steps.native-pin.outputs.revision }}-${{ hashFiles('native/SConstruct', 'scripts/apple-native.sh') }}
      - name: Cache stock Godot .NET
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-zip
          key: godot-${{ env.GODOT_VERSION }}-mono-macos-universal
      - run: scripts/install-godot.sh
      - name: Build universal libraries and qualify ARM64 and Rosetta runtimes
        run: python3 scripts/apple-run.py bash scripts/apple-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-macos
          path: ${{ runner.temp }}/dirge-smoke-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: addons/dirge/bin/
          if-no-files-found: error

  package:
    needs: [trust, test, validate, smoke, native-linux, native-windows, native-macos]
    # Every full target is mandatory. Only explicit manual diagnostics may omit any.
    if: ${{ !cancelled() && needs.trust.result == 'success' && needs.test.result == 'success' && needs.validate.result == 'success' && needs.smoke.result == 'success' && needs.native-linux.result == 'success' && ((needs.native-windows.result == 'success' && needs.native-macos.result == 'success') || needs.trust.outputs.partial == 'true') }}
    runs-on: ${{ fromJSON(needs.trust.outputs.runner) }}
    outputs:
      name: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.trust.outputs.repository }}
          ref: ${{ needs.trust.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: addons/dirge/bin/
          merge-multiple: true
      - name: Assemble validated addon ZIP
        id: zip
        env:
          PARTIAL: ${{ needs.trust.outputs.partial }}
        run: |
          if [[ "$PARTIAL" = true ]]; then
            python3 scripts/apple-run.py bash scripts/package.sh --suffix -partial
          else
            python3 scripts/apple-run.py bash scripts/package.sh
          fi
          files=(dist/Dirge-v*.zip)
          [[ ${#files[@]} = 1 && -f "${files[0]}" ]]
          echo "name=$(basename "${files[0]}" .zip)" >> "$GITHUB_OUTPUT"
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

  managed-package:
    # The managed-host source ZIP .NET hosts (Kraken's Keg, God Complex) install; built here, never by hand.
    # Every run proves it builds against the locked NecronomiDOM; only managed/1.0.x and v* pushes publish it.
    needs: trust
    if: needs.trust.outputs.requalification_run == ''
    runs-on: [self-hosted, Linux, X64, eldritch-linux]
    outputs:
      publish: ${{ steps.provenance.outputs.publish }}
    env:
      # Shared producer host: never attach to reusable MSBuild/Roslyn servers owned by other work.
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.trust.outputs.repository }}
          ref: ${{ needs.trust.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/fetch-deps.sh
      - name: Build the commit-pinned managed-host ZIP
        run: python3 scripts/package-managed.py
      - name: Record provenance (managed/1.0.x commits only)
        id: provenance
        env:
          PUBLISH: ${{ github.event_name == 'push' && needs.trust.outputs.partial != 'true' && needs.trust.outputs.repository == 'Eldritch-Game-Studio/Dirge' && (github.ref == 'refs/heads/managed/1.0.x' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ "$PUBLISH" != true ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$sha" origin/managed/1.0.x; then
            echo "::error::$sha is not on managed/1.0.x; managed-host releases publish only that line."
            exit 1
          fi
          python3 scripts/managed-provenance.py "dist/dirge-managed-$sha.zip" --output dist/provenance.json
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dirge-managed
          path: |
            dist/dirge-managed-*.zip
            dist/provenance.json
          if-no-files-found: error

  qualification:
    needs: [trust, test, validate, smoke, native-linux, native-windows, native-macos, package, managed-package]
    if: always() && needs.trust.outputs.requalification_run == ''
    runs-on: [self-hosted, Linux, X64, eldritch-linux]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          TRUST: ${{ needs.trust.result }}
          PACKAGE: ${{ needs.package.result }}
          MANAGED_PACKAGE: ${{ needs.managed-package.result }}
        run: |
          printf '%s\n' "$RESULTS"
          if [[ "$TRUST" != success ]]; then
            echo '::error::Local qualification withheld: source requires an internal collaborator or explicit reviewed-head manual approval. No untrusted source was executed.'
            exit 1
          fi
          [[ "$PACKAGE" = success && "$MANAGED_PACKAGE" = success ]]

  release:
    needs: [trust, package, qualification]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.trust.outputs.partial != 'true' && needs.qualification.result == 'success' }}
    runs-on: [self-hosted, macOS, ARM64, eldritch-apple]
    permissions:
      contents: write
    steps:
      # No checkout or build: publication credentials never enter build steps.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.name }}
          path: ${{ runner.temp }}/dirge-release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/dirge-release-${{ github.run_id }}-${{ github.run_attempt }}/${{ needs.package.outputs.name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  managed-release:
    # Publishes managed-<sha12> (a prerelease unless built from a v* tag) with provenance.json, then notifies the games.
    needs: [trust, managed-package, qualification]
    if: ${{ needs.managed-package.outputs.publish == 'true' && needs.qualification.result == 'success' }}
    # Dirge's own Crucible runner: its host gh login sends the cross-repository dispatches.
    runs-on: [self-hosted, Linux, X64, crucible, dirge]
    concurrency:
      group: managed-release-${{ needs.trust.outputs.revision }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # No checkout or build: publication credentials never enter build steps.
      - uses: actions/download-artifact@v4
        with:
          name: dirge-managed
          path: ${{ runner.temp }}/dirge-managed-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish the managed-<sha12> release
        id: release
        env:
          ARTIFACT: ${{ runner.temp }}/dirge-managed-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ needs.trust.outputs.revision }}
          TAGGED: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          provenance="$ARTIFACT/provenance.json"
          sha="$(jq -r .sha "$provenance")"; tag="$(jq -r .release_tag "$provenance")"
          zip="$(jq -r .zip "$provenance")"; digest="$(jq -r .zip_sha256 "$provenance")"
          [[ "$sha" = "$REVISION" && "$tag" = "managed-${sha:0:12}" && "$zip" = "dirge-managed-$sha.zip" ]]
          echo "$digest  $ARTIFACT/$zip" | sha256sum -c -
          if gh api "repos/$GH_REPO/releases/tags/$tag" > "$ARTIFACT/existing.json" 2>/dev/null; then
            # Same commit from a branch push and its tag push: the package is deterministic, so it must match.
            existing="$(jq -r --arg zip "$zip" '.assets[] | select(.name == $zip) | .digest // ""' "$ARTIFACT/existing.json")"
            if [[ -n "$existing" && "$existing" != "sha256:$digest" ]]; then
              echo "::error::$tag already publishes $zip with $existing, not sha256:$digest"
              exit 1
            fi
            [[ -n "$existing" ]] || gh release upload "$tag" "$ARTIFACT/$zip" "$provenance" --clobber
            if [[ "$TAGGED" = true ]]; then gh release edit "$tag" --prerelease=false; fi
          else
            prerelease=(--prerelease)
            [[ "$TAGGED" = true ]] && prerelease=()
            gh release create "$tag" "$ARTIFACT/$zip" "$provenance" "${prerelease[@]}" --target "$sha" \
              --title "Dirge managed-host ${sha:0:12}" \
              --notes "CI-built managed-host package of Dirge managed/1.0.x@$sha (run $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID), qualified against NecronomiDOM $(jq -r .upstream.necronomidom.sha "$provenance"). Install with the consumer's addons-update; verify with provenance.json."
          fi
          {
            echo "sha=$sha"; echo "tag=$tag"; echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
      - name: Notify consumers (upstream-package-published)
        env:
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          payload="$(jq -n --arg sha "$SHA" --arg tag "$TAG" --arg digest "$DIGEST" \
            '{event_type: "upstream-package-published", client_payload: {package: "dirge", sha: $sha, release_tag: $tag, zip_sha256: $digest}}')"
          # Kraken's Keg is the only CD consumer; other hosts install published releases themselves.
          env -u GH_TOKEN -u GITHUB_TOKEN gh api repos/Eldritch-Game-Studio/Krakens-Keg-Godot/dispatches --input - <<< "$payload"
          echo "dispatched $TAG to Krakens-Keg-Godot"

  managed-requalification:
    # Read-only recovery: no build and no execution of the earlier revision's code.
    needs: trust
    if: needs.trust.outputs.requalification_run != ''
    runs-on: [self-hosted, Linux, X64, eldritch-linux]
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.evidence.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.trust.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate exact-source FULL qualification and identical released ZIP
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN: ${{ needs.trust.outputs.requalification_run }}
          EVIDENCE: ${{ runner.temp }}/dirge-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 scripts/requalify-managed.py --qualified-run-id "$QUALIFIED_RUN" --output "$EVIDENCE"
          echo "revision=$(jq -r .sha "$EVIDENCE"/provenance-*.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: managed-requalification
          path: ${{ runner.temp }}/dirge-evidence-${{ github.run_id }}-${{ github.run_attempt }}/provenance-*.json
          if-no-files-found: error

  managed-requalification-release:
    needs: [trust, managed-requalification]
    runs-on: [self-hosted, Linux, X64, crucible, dirge]
    timeout-minutes: 10
    concurrency:
      group: managed-release-${{ needs.managed-requalification.outputs.revision }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout or build with publication credentials. Never overwrite or notify consumers.
      - uses: actions/download-artifact@v4
        with:
          name: managed-requalification
          path: ${{ runner.temp }}/dirge-evidence-publish-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Recheck live evidence and append one immutable recovery asset
        uses: actions/github-script@v7
        env:
          EVIDENCE: ${{ runner.temp }}/dirge-evidence-publish-${{ github.run_id }}-${{ github.run_attempt }}
          QUALIFIED_RUN: ${{ needs.trust.outputs.requalification_run }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {isDeepStrictEqual} = require('util');
            const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            const ensure = (ok, message) => { if (!ok) throw new Error(message); };
            const name = `provenance-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}.json`;
            ensure(fs.readdirSync(process.env.EVIDENCE).join() === name, 'Expected exactly one recovery receipt');
            const bytes = fs.readFileSync(`${process.env.EVIDENCE}/${name}`);
            const proof = JSON.parse(bytes);
            ensure(proof.schema === 'eldritch.managed-requalification/1' && proof.package === 'dirge' &&
              proof.repository === 'Eldritch-Game-Studio/Dirge' && proof.branch === 'managed/1.0.x' &&
              proof.ref === context.ref && proof.run_id === context.runId &&
              proof.run_attempt === Number(process.env.GITHUB_RUN_ATTEMPT) &&
              proof.qualified_run_id === Number(process.env.QUALIFIED_RUN) &&
              proof.evidence_kind === 'independent-full-qualification-and-identical-managed-zip' &&
              /^[0-9a-f]{40}$/.test(proof.sha) && /^[0-9a-f]{64}$/.test(proof.zip_sha256) &&
              proof.release_tag === `managed-${proof.sha.slice(0, 12)}` &&
              proof.zip === `dirge-managed-${proof.sha}.zip`, 'Recovery identity differs');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: proof.qualified_run_id
            });
            ensure(run.repository.full_name === proof.repository && run.path === '.github/workflows/ci.yml' &&
              run.head_branch === proof.branch && run.head_sha === proof.sha &&
              ['push', 'workflow_dispatch'].includes(run.event) && run.status === 'completed' &&
              run.conclusion === 'success' && run.run_attempt === proof.qualified_run_attempt,
              'Independent exact-source qualification is not live and successful');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
            });
            for (const required of ['trust', 'test', 'validate', 'smoke', 'native-linux',
              'Windows x64 cross-build + Proton compatibility', 'native-macos', 'package',
              'managed-package', 'qualification']) {
              const found = jobs.filter(job => job.name === `local / ${required}`);
              ensure(found.length === 1 && found[0].status === 'completed' &&
                found[0].conclusion === 'success' && found[0].run_attempt === run.run_attempt,
                `Missing FULL qualification: ${required}`);
            }
            const {data: compare} = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${proof.sha}...managed/1.0.x`
            });
            ensure(['ahead', 'identical'].includes(compare.status), 'Source left maintained branch');
            const {data: release} = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: proof.release_tag
            });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100
            });
            const one = assetName => {
              const found = assets.filter(asset => asset.name === assetName);
              ensure(found.length === 1, `Missing or ambiguous original asset: ${assetName}`);
              return found[0];
            };
            const originalAsset = one('provenance.json');
            const packageAsset = one(proof.zip);
            ensure(!release.draft && proof.original_provenance.asset === 'provenance.json' &&
              originalAsset.id === proof.original_provenance.asset_id &&
              originalAsset.digest === `sha256:${proof.original_provenance.sha256}` &&
              packageAsset.digest === `sha256:${proof.zip_sha256}`, 'Original release assets changed');
            const {data: originalData} = await github.rest.repos.getReleaseAsset({
              ...context.repo, asset_id: originalAsset.id, headers: {accept: 'application/octet-stream'}
            });
            const originalBytes = Buffer.from(originalData);
            ensure(hash(originalBytes) === proof.original_provenance.sha256, 'Original provenance SHA256 differs');
            const original = JSON.parse(originalBytes);
            ensure(original.schema === 'eldritch.managed-provenance/1' &&
              ['package', 'repository', 'branch', 'sha', 'release_tag', 'zip', 'zip_sha256', 'upstream']
                .every(key => isDeepStrictEqual(original[key], proof[key])),
              'Recovery changed original identity, ZIP, or locked NecronomiDOM');
            const {data: artifact} = await github.rest.actions.getArtifact({
              ...context.repo, artifact_id: proof.qualified_artifact.id
            });
            ensure(!artifact.expired && artifact.name === 'dirge-managed' &&
              proof.qualified_artifact.name === artifact.name &&
              artifact.digest === `sha256:${proof.qualified_artifact.sha256}` &&
              artifact.workflow_run.id === run.id && artifact.workflow_run.head_sha === proof.sha,
              'Exact-source managed artifact is no longer available');
            ensure(!assets.some(asset => asset.name === name), 'Recovery asset already exists; refusing replacement');
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.id, name, data: bytes,
              headers: {'content-type': 'application/json', 'content-length': bytes.length}
            });
            await core.summary.addHeading('Append-only managed requalification')
              .addRaw(`Asset: ${name}\n\nSHA256: ${hash(bytes)}\n\nIndependent qualification: ${run.html_url}\n\n` +
                'Original provenance.json and managed ZIP were not replaced. No consumer notification was sent.')
              .write();
